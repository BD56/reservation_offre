<div class="modal fade" id="modalDetailOffre" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title fw-bold" id="detailModalTitle">Détails de l'offre</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>

      <div class="modal-body p-0">
        <ul class="nav nav-tabs px-3 pt-3 bg-light" id="detailTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="inscrits-tab" data-bs-toggle="tab" data-bs-target="#inscrits" type="button" role="tab">
              <i class="bi bi-people"></i> Liste des Réservations
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="parametres-tab" data-bs-toggle="tab" data-bs-target="#parametres" type="button" role="tab">
              <i class="bi bi-pencil-square"></i> Modifier l'Offre
            </button>
          </li>
        </ul>

        <div class="tab-content p-4" id="detailTabsContent">
          <div class="tab-pane fade show active" id="inscrits" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0 text-secondary"><i class="bi bi-list-check"></i> Commandes et Inscrits</h6>
              <button class="btn btn-primary btn-sm fw-bold shadow-sm" id="btnImprimerReservations">
                <i class="bi bi-printer"></i> IMPRIMER LE RÉSUMÉ
              </button>
            </div>

            <div class="table-responsive">
              <table class="table table-bordered table-res align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Client</th>
                    <th>Contact</th>
                    <th>Détail (Articles)</th>
                    <th style="width: 160px;">État</th>
                  </tr>
                </thead>
                <tbody id="tableInscritsBody"></tbody>
              </table>
            </div>
          </div>

          <div class="tab-pane fade" id="parametres" role="tabpanel">
            <form id="formEditOffre">
              <input type="hidden" id="editOpId">
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">NOM DE L'OFFRE *</label>
                <input type="text" class="form-control" id="editOpNom" required>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">TYPE *</label>
                  <select class="form-select" id="editOpType" required>
                    <option value="Produit">Produits</option>
                    <option value="Evenement">Évènement</option>
                  </select>
                </div>
                <div class="col-md-6" id="blocModeSaisie_edit">
                  <label class="form-label small fw-bold text-secondary">MODE DE SAISIE</label>
                  <select class="form-select" id="editOpMode">
                    <option value="Libre">Libre</option>
                    <option value="Predefini">Prédéfini</option>
                  </select>
                </div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">DÉBUT</label>
                  <input type="date" class="form-control" id="editOpDateDebut">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">FIN</label>
                  <input type="date" class="form-control" id="editOpDateFin">
                </div>
              </div>
              <div class="mb-3" id="blocArticlesPredefinis_edit" style="display: none;">
                <label class="form-label small fw-bold text-secondary">ARTICLES (Séparés par une virgule)</label>
                <textarea class="form-control" id="editOpArticles" rows="2"></textarea>
              </div>
              <div class="text-end mt-4">
                <button type="button" class="btn btn-dark fw-bold" id="btnUpdateOffre">
                  <i class="bi bi-check2-circle"></i> METTRE À JOUR L'OFFRE
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
