<!-- Feuille de préparation : aperçu (total à préparer + liste à pointer), puis impression dans un onglet à part. -->
<script data-version="2026.10.15-1102">
  let offreFeuille = null;

  function ouvrirFeuille(idOp) {
    if (!trouverOffre(idOp)) return;
    offreFeuille = idOp;
    $("feuilleAnnulees").checked = false;
    dessinerFeuille();
    ouvrirVoile("voileFeuille");
  }
  $("feuilleAnnulees").addEventListener("change", dessinerFeuille);

  function dessinerFeuille() {
    const op = trouverOffre(offreFeuille);
    if (!op) return;
    const toutes = reservationsDe(op.id) || [];
    const actives = toutes.filter((r) => r.etat !== "Annulé");
    const listees = toutes
      .filter((r) => $("feuilleAnnulees").checked || r.etat !== "Annulé")
      .slice()
      .sort((a, b) => (a.nom + " " + a.prenom).localeCompare(b.nom + " " + b.prenom));
    const total = totauxArticles(actives);
    const produits = op.type === "Produit";
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");

    let html = `<header><div><h1>${echapper(op.nom)}</h1><p>${echapper(periodeLongue(op))} · ${actives.length} réservation${actives.length > 1 ? "s" : ""}</p></div>
      <div class="imprime">Imprimée le ${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}<br>à ${p(d.getHours())}:${p(d.getMinutes())}</div></header>`;
    if (produits) {
      html += `<h2>Total à préparer</h2><div class="defile"><table><thead><tr><th>Article</th><th style="text-align:center">Quantité</th></tr></thead><tbody>${
        total.map((t) => `<tr><td>${echapper(t.nom)}</td><td class="qte">${t.total}</td></tr>`).join("") ||
        '<tr><td colspan="2">Rien à préparer</td></tr>'
      }</tbody></table></div>`;
    }
    html += `<h2>${produits ? "Commandes à pointer" : "Inscrits"} (${listees.length})</h2>
      <div class="defile"><table><thead><tr><th>✓</th><th>Client</th><th>Contact</th>${produits ? "<th>Commande</th>" : ""}<th>État</th></tr></thead><tbody>${
        listees
          .map(
            (r) =>
              `<tr class="${r.etat === "Annulé" ? "barre" : ""}"><td class="case">${r.etat === "Retrait" ? "☑" : "☐"}</td><td><b>${echapper(r.nom)}</b> ${echapper(r.prenom)}</td><td>${echapper(contactLisible(r))}</td>${produits ? `<td>${listeArticlesHtml(r)}</td>` : ""}<td>${echapper(LIBELLE_ETAT[r.etat] || r.etat)}</td></tr>`
          )
          .join("") || `<tr><td colspan="${produits ? 5 : 4}">Aucune réservation</td></tr>`
      }</tbody></table></div>
      <p class="pied">Classement par nom. Les réservations annulées ne comptent pas dans le total.</p>`;
    $("feuille").innerHTML = html;
  }

  // Impression dans un onglet à part, qui ne contient que la feuille (fond blanc) : l'application
  // ne bouge jamais (sous Safari, masquer l'application le temps de l'impression laissait une
  // page blanche). Le style de l'onglet est celui de la page, sans aucune ressource externe.
  $("feuilleImprimer").addEventListener("click", function () {
    const op = trouverOffre(offreFeuille);
    const onglet = window.open("", "_blank");
    if (!onglet) {
      showToast(
        "Le navigateur a bloqué l'onglet d'impression : autorisez les fenêtres pour ce site, puis réessayez.",
        "error"
      );
      return;
    }
    const style = document.querySelector("style").textContent;
    const fin = "</" + "script>";
    onglet.document.open();
    onglet.document.write(
      `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">` +
        `<title>${echapper("Feuille de préparation · " + (op ? op.nom : ""))}</title>` +
        `<style>${style}
          html, body { height: auto; }
          body { display: block; background: #fff; padding: 20px; }
          .feuille { max-width: 860px; margin: 0 auto; box-shadow: none; }
          .barre-impression { max-width: 860px; margin: 0 auto 4px; padding: 0 40px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--doux); font-size: 14px; }
          @page { margin: 12mm; }
          @media print { body { padding: 0; } .barre-impression { display: none; } .feuille { padding: 0; max-width: none; } }
        </style></head><body>` +
        `<div class="barre-impression"><button type="button" class="sec accent" onclick="window.print()">Imprimer</button>` +
        `<span>Fermez cet onglet après l'impression pour revenir à l'application.</span></div>` +
        `<div class="feuille">${$("feuille").innerHTML}</div>` +
        `<script>window.addEventListener("load", function () { window.print(); });${fin}` +
        `</body></html>`
    );
    onglet.document.close();
    onglet.focus();
  });
</script>
