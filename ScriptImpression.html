<!-- Feuille de préparation : aperçu (total à préparer + liste à pointer), puis impression. -->
<script data-version="2026.10.15-1052">
  let offreFeuille = null;

  function ouvrirFeuille(idOp) {
    if (!trouverOffre(idOp)) return;
    offreFeuille = idOp;
    $("feuilleAnnulees").checked = false;
    dessinerFeuille();
    ouvrirVoile("voileFeuille");
  }
  $("feuilleAnnulees").addEventListener("change", dessinerFeuille);

  function dessinerFeuille() {
    const op = trouverOffre(offreFeuille);
    if (!op) return;
    const toutes = reservationsDe(op.id) || [];
    const actives = toutes.filter((r) => r.etat !== "Annulé");
    const listees = toutes
      .filter((r) => $("feuilleAnnulees").checked || r.etat !== "Annulé")
      .slice()
      .sort((a, b) => (a.nom + " " + a.prenom).localeCompare(b.nom + " " + b.prenom));
    const total = totauxArticles(actives);
    const produits = op.type === "Produit";
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");

    let html = `<header><div><h1>${echapper(op.nom)}</h1><p>${echapper(periodeLongue(op))} · ${actives.length} réservation${actives.length > 1 ? "s" : ""}</p></div>
      <div class="imprime">Imprimée le ${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}<br>à ${p(d.getHours())}:${p(d.getMinutes())}</div></header>`;
    if (produits) {
      html += `<h2>Total à préparer</h2><div class="defile"><table><thead><tr><th>Article</th><th style="text-align:center">Quantité</th></tr></thead><tbody>${
        total.map((t) => `<tr><td>${echapper(t.nom)}</td><td class="qte">${t.total}</td></tr>`).join("") ||
        '<tr><td colspan="2">Rien à préparer</td></tr>'
      }</tbody></table></div>`;
    }
    html += `<h2>${produits ? "Commandes à pointer" : "Inscrits"} (${listees.length})</h2>
      <div class="defile"><table><thead><tr><th>✓</th><th>Client</th><th>Contact</th>${produits ? "<th>Commande</th>" : ""}<th>État</th></tr></thead><tbody>${
        listees
          .map(
            (r) =>
              `<tr class="${r.etat === "Annulé" ? "barre" : ""}"><td class="case">${r.etat === "Retrait" ? "☑" : "☐"}</td><td><b>${echapper(r.nom)}</b> ${echapper(r.prenom)}</td><td>${echapper(contactLisible(r))}</td>${produits ? `<td>${listeArticlesHtml(r)}</td>` : ""}<td>${echapper(LIBELLE_ETAT[r.etat] || r.etat)}</td></tr>`
          )
          .join("") || `<tr><td colspan="${produits ? 5 : 4}">Aucune réservation</td></tr>`
      }</tbody></table></div>
      <p class="pied">Classement par nom. Les réservations annulées ne comptent pas dans le total.</p>`;
    $("feuille").innerHTML = html;
  }

  // Seule la copie de la feuille est imprimée (CSS @media print) ; vidée après l'impression
  $("feuilleImprimer").addEventListener("click", function () {
    const zone = $("zoneImpression");
    zone.innerHTML = `<div class="feuille">${$("feuille").innerHTML}</div>`;
    window.addEventListener(
      "afterprint",
      function () {
        zone.innerHTML = "";
      },
      { once: true }
    );
    window.print();
  });
</script>
