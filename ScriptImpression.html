<!-- Feuille de préparation : aperçu (totaux par article + liste à pointer), puis impression. -->
<script data-version="2026.10.26-1833">
  let offreFeuille = null;

  function ouvrirFeuille(idOp) {
    if (!trouverOffre(idOp)) return;
    offreFeuille = idOp;
    $("feuilleAnnulees").checked = false;
    dessinerFeuille();
    ouvrirVoile("voileFeuille");
  }
  $("feuilleAnnulees").addEventListener("change", dessinerFeuille);

  function dessinerFeuille() {
    const op = trouverOffre(offreFeuille);
    if (!op) return;
    const toutes = reservationsDe(op.id) || [];
    const actives = toutes.filter((r) => r.etat !== "Annulé");
    const listees = toutes
      .filter((r) => $("feuilleAnnulees").checked || r.etat !== "Annulé")
      .slice()
      .sort((a, b) => (a.nom + " " + a.prenom).localeCompare(b.nom + " " + b.prenom));
    const produits = op.type === "Produit";
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");

    let html = `<header><div><h1>${echapper(op.nom)}</h1><p>${echapper(periodeLongue(op))} · ${actives.length} réservation${actives.length > 1 ? "s" : ""}</p></div>
      <div class="imprime">Imprimée le ${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}<br>à ${p(d.getHours())}:${p(d.getMinutes())}</div></header>`;
    if (produits) {
      const bilan = bilanArrivages(op, toutes).filter((t) => t.commande || t.recu);
      html += `<h2>Totaux par article</h2><div class="defile"><table><thead><tr><th>Article</th><th class="qte">Commandé</th><th class="qte">Arrivé</th><th class="qte">Remis</th><th class="qte">À remettre</th><th class="qte">En stock</th></tr></thead><tbody>${
        bilan
          .map(
            (t) =>
              `<tr><td>${echapper(t.nom)}</td><td class="qte">${t.commande}</td><td class="qte">${t.arrive}</td><td class="qte">${t.remis}</td><td class="qte">${t.arrive - t.remis}</td><td class="qte">${Math.max(0, t.stock)}</td></tr>`
          )
          .join("") || '<tr><td colspan="6">Rien à préparer</td></tr>'
      }</tbody></table></div>`;
    }
    html += `<h2>${produits ? "Commandes à pointer" : "Inscrits"} (${listees.length})</h2>
      <div class="defile"><table><thead><tr><th>✓</th><th>Client</th><th>Contact</th>${produits ? "<th>Commande</th>" : ""}<th>État</th></tr></thead><tbody>${
        listees
          .map(
            (r) =>
              `<tr class="${r.etat === "Annulé" ? "barre" : ""}"><td class="case">${(produits ? situation(r) === "terminee" : r.etat === "Retrait") ? "☑" : "☐"}</td><td><b>${echapper(r.nom)}</b> ${echapper(r.prenom)}</td><td>${echapper(contactLisible(r))}</td>${produits ? `<td>${listeArrivagesHtml(r)}</td>` : ""}<td>${echapper(produits ? libelleSituation(r) : LIBELLE_ETAT[r.etat] || r.etat)}</td></tr>`
          )
          .join("") || `<tr><td colspan="${produits ? 5 : 4}">Aucune réservation</td></tr>`
      }</tbody></table></div>
      <p class="pied">Classement par nom. Les réservations annulées ne comptent pas dans les totaux. « 1/2 » : 1 arrivé sur 2 commandés.</p>`;
    $("feuille").innerHTML = html;
  }

  // Impression comme dans l'app chèques : la feuille est copiée dans #zoneImpression (seule
  // visible à l'impression, CSS @media print), l'aperçu est fermé, puis window.print().
  // La zone n'est PAS vidée après coup : sous Safari, l'impression ne bloque pas la page et
  // la vider à « afterprint » pouvait laisser une page blanche. Elle est remplacée à la
  // prochaine impression.
  $("feuilleImprimer").addEventListener("click", function () {
    $("zoneImpression").innerHTML = `<div class="feuille">${$("feuille").innerHTML}</div>`;
    fermerVoile("voileFeuille");
    window.print();
  });
</script>
