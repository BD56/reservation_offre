<!-- Outils communs (échappement, fenêtres, messages), démarrage, aide et mentions. -->
<script data-version="2026.10.14-2030">
  // Échappe le texte saisi avant de l'insérer dans du HTML (noms avec < ' " & etc.)
  function echapper(valeur) {
    return String(valeur == null ? "" : valeur).replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
    );
  }

  // Réutilise l'instance existante pour éviter les fonds gris empilés
  function modal(id) {
    return bootstrap.Modal.getOrCreateInstance(document.getElementById(id));
  }

  // yyyy-MM-dd -> dd/MM/yyyy
  function dateFr(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? `${m[3]}/${m[2]}/${m[1]}` : iso || "-";
  }

  function showToast(message, type = "success") {
    const toastEl = document.getElementById("appToast");
    toastEl.className = `toast align-items-center border-0 text-white ${type === "success" ? "bg-success" : type === "info" ? "bg-info" : "bg-danger"}`;
    document.getElementById("toastMessage").innerHTML = message;
    bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 4000 }).show();
  }

  function messageErreur(err) {
    return err && err.message ? err.message : String(err);
  }

  function showErreur(err) {
    showToast("<i class='bi bi-exclamation-triangle'></i> Erreur : " + echapper(messageErreur(err)), "error");
  }

  // Démarrage : la copie glissée dans la page suffit (aucun appel au serveur) ; sinon on la demande.
  document.addEventListener("DOMContentLoaded", function () {
    if (COPIE_INITIALE) {
      appliquerCopie(COPIE_INITIALE);
    } else {
      rechargerCopie(function (e) {
        document.getElementById("operationSelect").innerHTML =
          '<option value="" disabled selected>Impossible de charger les offres</option>';
        showToast("Erreur de connexion : " + echapper(messageErreur(e)), "error");
      });
    }
    surveillerCopie();
  });

  // --- OUVRIR MENTIONS LEGALES ET AIDE ---
  function ouvrirMentions() {
    modal("modalMentions").show();
  }

  function ouvrirAide() {
    bootstrap.Offcanvas.getOrCreateInstance(document.getElementById("offcanvasHelp")).show();
  }

  function ouvrirOperations() {
    modal("modalOperations").show();
  }
</script>
